name: Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      - "rosalind-web/**"
      - ".github/workflows/rosalind-web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
            path: "./rosalind-web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
