[project]
name = "rosalind"
version = "0.1.0"
description = "Rosalind personal-data warehouse backend"
readme = "README.md"
authors = [
    { name = "Felipe Kharaba", email = "felipe.kharaba@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.0",
    "boto3>=1.35.0",
    "fastapi>=0.141.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "boto3-stubs[s3]>=1.35.0",
    "httpx>=0.28.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "testcontainers>=4.10.0",
]
