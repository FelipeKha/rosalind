[project]
name = "rosalind"
version = "0.1.0"
description = "Rosalind personal-data warehouse backend"
readme = "README.md"
authors = [
    { name = "Felipe Kharaba", email = "felipe.kharaba@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
