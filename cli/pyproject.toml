[project]
name = "cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felipe Kharaba", email = "felipe.kharaba@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35.0",
    "httpx>=0.28.0",
    "typer>=0.16.0",
]

[project.scripts]
rosalind = "cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "boto3-stubs[s3]>=1.35.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "testcontainers>=4.10.0",
]
