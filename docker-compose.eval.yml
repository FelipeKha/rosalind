# Isolated evaluation stack: its own Postgres (ParadeDB + pgvector), object
# storage, and Keycloak — separate from the dev stack in docker-compose.yml.
#
# Run through the `just eval-*` recipes, which use a dedicated Compose project:
#
#   docker compose -p rosalind-eval -f docker-compose.eval.yml up -d
#
# Ports match the dev stack (docker-compose.yml) so the backend and CLI need no
# environment-specific configuration. Because the host ports are identical, the
# dev and eval stacks cannot run at the same time: stop one (just down /
# just eval-down) before starting the other.

services:
  postgres:
    image: paradedb/paradedb:0.26.0-pg18
    environment:
      POSTGRES_USER: rosalind
      POSTGRES_PASSWORD: rosalind
      POSTGRES_DB: rosalind_eval
    ports:
      - "5432:5432"
    volumes:
      - eval_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosalind -d rosalind_eval"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3
    environment:
      AWS_ACCESS_KEY_ID: rosalind
      AWS_SECRET_ACCESS_KEY: rosalind
    ports:
      - "8333:8333"
    volumes:
      - eval_seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:18
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - eval_keycloak_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Keep the token issuer stable at the host port (same as dev).
      KC_HOSTNAME: http://localhost:8080
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/rosalind-realm.json:/opt/keycloak/data/import/rosalind-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/rosalind/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r' >&3 && grep -q 'issuer' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  eval_postgres_data:
  eval_seaweedfs_data:
  eval_keycloak_db_data:
