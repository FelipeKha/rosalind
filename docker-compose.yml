services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rosalind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosalind}
      POSTGRES_DB: ${POSTGRES_DB:-rosalind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rosalind} -d ${POSTGRES_DB:-rosalind}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3
    environment:
      AWS_ACCESS_KEY_ID: ${ROSALIND_S3_ACCESS_KEY:-rosalind}
      AWS_SECRET_ACCESS_KEY: ${ROSALIND_S3_SECRET_KEY:-rosalind}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/rosalind-realm.json:/opt/keycloak/data/import/rosalind-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/rosalind/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r' >&3 && grep -q 'issuer' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  seaweedfs_data:
