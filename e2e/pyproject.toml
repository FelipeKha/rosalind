[project]
name = "rosalind-e2e"
version = "0.1.0"
description = "End-to-end tests for the Rosalind CLI import pipeline"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35.0",
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "testcontainers>=4.10.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = []
