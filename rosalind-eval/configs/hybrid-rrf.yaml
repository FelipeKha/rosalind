# Example experiment: RRF with a smaller rerank window, illustrated fully.
name: rrf-rerank40
dataset: ../e2e/gold/email_rag_cases.yaml
description: Hybrid RRF, rerank window of 40 candidates.
overrides:
  mode: hybrid
  lexical_k: 50
  semantic_k: 50
  fused_k: 40
  rerank_k: 40
  window_k: 25
  reranker: bge-reranker-v2-m3/v1
  chunk_prefix: true
  fusion:
    strategy: rrf
    rrf_k: 60
    lexical_weight: 1.0
    semantic_weight: 1.0
    max_chunks_per_item: 2
