[project]
name = "rosalind-eval"
version = "0.1.0"
description = "Search evaluation and experimentation for Rosalind"
authors = [
    { name = "Felipe Kharaba", email = "felipe.kharaba@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rosalind",
    "pyyaml>=6.0.2",
    "rich>=13.0.0",
    "typer>=0.16.0",
]

[project.scripts]
rosalind-eval = "rosalind_eval.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
rosalind = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6,<0.17",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
